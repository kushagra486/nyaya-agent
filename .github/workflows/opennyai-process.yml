name: Legal Pulse - Judgment structuring (OpenNyAI)

# Runs less often than the RSS ingestion job since model loading + inference
# is much heavier than an RSS fetch. Daily is a reasonable starting cadence
# given the current seed list is small - increase frequency once you've
# added more judgment sources and confirmed run time/reliability.
on:
  schedule:
    - cron: "0 3 * * *" # once daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run judgment structuring
        working-directory: scripts
        run: python process_judgments.py
