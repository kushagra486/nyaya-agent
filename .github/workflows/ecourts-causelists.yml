name: eCourts - Cause List fetch

# Runs less often than RSS ingestion - cause lists are typically published
# once per day per court, and each court lookup involves CAPTCHA-solving
# retries against a real government portal, so this is intentionally not
# aggressive.
on:
  schedule:
    - cron: "30 4 * * *" # once daily at 04:30 UTC (~10am IST)
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tesseract-ocr (required by ecourts' CAPTCHA solver)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ecourts.txt

      - name: Fetch cause lists
        working-directory: scripts
        run: python fetch_cause_lists.py
